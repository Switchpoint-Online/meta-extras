# Create FTP RAM directories on every boot.
# /tmp is tmpfs — dirs are wiped automatically on reboot (no cleanup needed).
# /tmp/ftp         root:root 755  — non-writable chroot root (vsftpd requirement)
# /tmp/ftp/incoming  numeronsrv:numeronsrv 755  — writable upload target
d /tmp/ftp          0755 root       root       -
d /tmp/ftp/incoming 0755 numeronsrv numeronsrv -
