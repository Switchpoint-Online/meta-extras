#@TYPE: Machine
#@NAME: Raspberry Pi Compute Module Zero (64-bit)
#@DESCRIPTION: Machine configuration for the Raspberry Pi Compute Module Zero (CM0) using a 64-bit kernel/userland.

# Pull in all working settings from the Raspberry Pi Zero 2 W (64-bit) machine.
include conf/machine/raspberrypi0-2w-64.conf

# Ensure the CM0 device tree is built and deployed alongside the other Raspberry Pi DTBs.
# meta-raspberrypi uses KERNEL_DEVICETREE to decide which DTBs to build/deploy.
KERNEL_DEVICETREE:append = " broadcom/bcm2710-rpi-cm0.dtb"

# Force the Raspberry Pi firmware to load the CM0 DTB from the boot partition.
# This avoids the firmware auto-selecting a different DTB when the hardware ID is ambiguous.
RPI_EXTRA_CONFIG:append = "\n# Force CM0 DTB\ndevice_tree=bcm2710-rpi-cm0.dtb\n"
