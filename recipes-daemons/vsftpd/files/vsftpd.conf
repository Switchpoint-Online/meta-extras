anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022
dirmessage_enable=YES
xferlog_enable=YES
connect_from_port_20=YES
xferlog_std_format=YES
listen=YES
listen_ipv6=NO
pam_service_name=vsftpd

# Restrict logins to whitelist only
userlist_enable=YES
userlist_deny=NO
userlist_file=/etc/vsftpd.userlist

# Allow FTP login for users with nologin shell (numeronsrv uses /usr/sbin/nologin
# to block UART/interactive access — check_shell=NO lets vsftpd bypass that check)
check_shell=NO

# Chroot user to /tmp/ftp — root of chroot must be non-writable (owned root:root)
# Uploads go to /tmp/ftp/incoming/ which is owned by numeronsrv
chroot_local_user=YES
allow_writeable_chroot=NO
local_root=/tmp/ftp
