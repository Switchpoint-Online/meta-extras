MACHINE ??= "raspberrypi4-64"
# MACHINE ??= "raspberrypi5"
IMAGE_FSTYPES = "wic"
LICENSE_FLAGS_ACCEPTED = "synaptics-killswitch"
DISTRO ?= "tdn-os"
DISTRO_NAME = "TDN-OS"
DISTRO_VERSION = "3.6 RC6"
DISTRO_FEATURES:append = " systemd networkd pam usrmerge"
DISTRO_FEATURES:remove = " sysvinit"
ENABLE_UART = "1"
DISABLE_SPLASH = "1"
DISABLE_RPI_BOOT_LOGO = "1"
# hostname_pn-base-files = "TDN-Ethv3"
INHERIT += "extrausers"
ROOT_PASSWORD = "\$5\$zbhcKTd9d5tbZAU\$oWA7RvXvYM/ND55qM7r/vmvWwQFAXKWK9XgTOGto710"
EXTRA_USERS_PARAMS = "usermod -p '${ROOT_PASSWORD}' root; usermod -d /root root"
# EXTRA_IMAGE_FEATURES += "read-only-rootfs"
IMAGE_INSTALL:append = " hostapd vsftpd networkmanager"
IMAGE_INSTALL:append = " nodejs nodejs-npm node-red raspi-gpio"
IMAGE_INSTALL:append = " tdn-nr-bcm2711-scarthgap"
VIRTUAL-RUNTIME_init_manager = "systemd"
IMAGE_ROOTFS_EXTRA_SPACE = "524288"
USER_CLASSES ?= "buildstats"
PATCHRESOLVE = "noop"
BB_DISKMON_DIRS ??= "\
    STOPTASKS,${TMPDIR},1G,100K \
    STOPTASKS,${DL_DIR},1G,100K \
    STOPTASKS,${SSTATE_DIR},1G,100K \
    STOPTASKS,/tmp,100M,100K \
    HALT,${TMPDIR},100M,1K \
    HALT,${DL_DIR},100M,1K \
    HALT,${SSTATE_DIR},100M,1K \
    HALT,/tmp,10M,1K"
PACKAGECONFIG:append:pn-qemu-system-native = " sdl"
CONF_VERSION = "2"
